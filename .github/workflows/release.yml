# Publishes a release when main's versionName has no tag yet, so bumping
# versionName and versionCode in app/build.gradle.kts is the whole release
# step. The APK is signed with the release key from the repo's Actions
# secrets (tools/release-key.sh --github), and is published only when its
# one signer is the certificate pinned in app/release-key.sha256. The notes
# list the commits since the last release.
#
# The key cannot be replaced without breaking updates, so the job that
# holds it can only read the repo, and the job that can publish never sees
# it. Actions are pinned to commits, since a tag can be moved to other code.
name: Release

on:
  push:
    branches: [main]
    paths: [app/build.gradle.kts]
  workflow_dispatch:

permissions:
  contents: read

concurrency: release

jobs:
  build:
    # workflow_dispatch can pick any branch; only main releases.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          [ -n "${version}" ] || { echo "::error::No versionName in app/build.gradle.kts"; exit 1; }
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already released; nothing to do."
            echo "new=false" >> "${GITHUB_OUTPUT}"
          else
            echo "new=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.version.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Build the signed APK
        if: steps.version.outputs.new == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.LAUNCHER_KEYSTORE_BASE64 }}
          LAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_KEYSTORE_PASSWORD }}
        run: |
          [ -n "${KEYSTORE_BASE64}" ] && [ -n "${LAUNCHER_KEYSTORE_PASSWORD}" ] \
            || { echo "::error::No release key: run tools/release-key.sh --github"; exit 1; }
          export LAUNCHER_KEYSTORE="${RUNNER_TEMP}/release.p12"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${LAUNCHER_KEYSTORE}"
          ./gradlew --console=plain :app:assembleRelease
          mkdir "${RUNNER_TEMP}/apk"
          cp app/build/outputs/apk/release/app-release.apk "${RUNNER_TEMP}/apk/launcher.apk"
          rm -f "${LAUNCHER_KEYSTORE}"

      - name: Check the APK's signer
        if: steps.version.outputs.new == 'true'
        run: |
          apksigner="$(find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          [ -n "${apksigner}" ] || { echo "::error::No apksigner under ${ANDROID_HOME}/build-tools"; exit 1; }
          pinned="$(tr -d '[:space:]' < app/release-key.sha256)"
          certs="$("${apksigner}" verify --print-certs "${RUNNER_TEMP}/apk/launcher.apk")" \
            || { echo "::error::apksigner cannot verify launcher.apk"; exit 1; }
          # "Signer #1 certificate ...", "Signer (minSdkVersion=...) ..." per SDK
          # range, or "V2 Signer: certificate ..." per scheme (apksigner 37).
          signers="$(printf '%s\n' "${certs}" | sed -n 's/^.*Signer.* certificate SHA-256 digest: //p' | sort -u)"
          if [ "$(printf '%s\n' "${signers}" | grep -c .)" -ne 1 ] || [ "${signers}" != "${pinned}" ]; then
            echo "${apksigner} said:"
            printf '%s\n' "${certs}"
            echo "::error::launcher.apk must have one signer, the certificate in app/release-key.sha256 (${pinned}); it has: $(printf '%s' "${signers:-none}" | tr '\n' ' ')"
            exit 1
          fi
          echo "launcher.apk is signed by the pinned release key ${pinned}"
          # firetv checks a download with tools/apk-signers.py, so it must
          # read the same signers as apksigner.
          read="$(python3 -I tools/apk-signers.py "${RUNNER_TEMP}/apk/launcher.apk" | sort -u)"
          [ "${read}" = "${signers}" ] \
            || { echo "::error::tools/apk-signers.py read $(printf '%s' "${read:-none}" | tr '\n' ' ')where apksigner read ${signers}"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.new == 'true'
        with:
          name: launcher
          path: ${{ runner.temp }}/apk/launcher.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: launcher
          path: ${{ runner.temp }}/apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # What is published is what firetv checks before installing.
          pinned="$(tr -d '[:space:]' < app/release-key.sha256)"
          read="$(python3 -I tools/apk-signers.py "${RUNNER_TEMP}/apk/launcher.apk" | sort -u)"
          [ "${read}" = "${pinned}" ] \
            || { echo "::error::launcher.apk is not signed by the pinned release key ${pinned}"; exit 1; }
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo "Install or update with \`firetv setup\` or the firetv menu; see the README."
            echo
            if [ -n "${previous}" ]; then
              echo "Changes since ${previous}:"
              git log --no-merges --format='- %s' "${previous}..HEAD"
            fi
          } > "${RUNNER_TEMP}/notes.md"
          gh release create "${TAG}" "${RUNNER_TEMP}/apk/launcher.apk" \
            --target "${GITHUB_SHA}" --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
